services:
  gateway:
    image: localhost/opencode-sandbox-gateway:${OCS_GATEWAY_TAG}
    build: ./gateway
    pull_policy: never
    restart: unless-stopped
    environment:
      UPSTREAM: opencode
      LOG_LEVEL: Notice
    volumes:
      - ${OCS_SEED_DIR}/allowlist:/etc/opencode-sandbox/allowlist:ro
    ports:
      - "127.0.0.1:${OCS_PORT}:4096"
    networks: [internal, egress]

  opencode:
    image: localhost/opencode-sandbox:${OCS_OPENCODE_VERSION}
    build:
      context: ./image
      args:
        OPENCODE_VERSION: ${OCS_OPENCODE_VERSION}
        UID: ${OCS_UID}
        GID: ${OCS_GID}
    pull_policy: never
    restart: unless-stopped
    depends_on: [gateway]
    environment:
      - OPENCODE_SERVER_PASSWORD
      - HTTP_PROXY=http://gateway:3128
      - HTTPS_PROXY=http://gateway:3128
      - http_proxy=http://gateway:3128
      - https_proxy=http://gateway:3128
      - NO_PROXY=localhost,127.0.0.1,::1
      - no_proxy=localhost,127.0.0.1,::1
    volumes:
      - ${OCS_CLONE_DIR}:${OCS_WORKDIR}
      - ${OCS_SEED_DIR}:/run/opencode-sandbox:ro
      - state:/home/dev/.local/share/opencode
      - cache:/home/dev/.cache
    working_dir: ${OCS_WORKDIR}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

networks:
  internal:
    internal: true
  egress: {}

volumes:
  state: {}
  cache:
    name: opencode-sandbox-cache
    external: true
