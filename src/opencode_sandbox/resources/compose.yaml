services:
  gateway:
    image: localhost/opencode-sandbox-gateway:${OCS_GATEWAY_TAG}
    build: ./gateway
    pull_policy: never
    restart: unless-stopped
    environment:
      UPSTREAM: opencode
    ports:
      - "127.0.0.1:${OCS_PORT}:4096"
    networks: [internal, egress]

  opencode:
    image: localhost/opencode-sandbox:${OCS_OPENCODE_VERSION}
    build:
      context: ./image
      args:
        OPENCODE_VERSION: ${OCS_OPENCODE_VERSION}
        UID: ${OCS_UID}
        GID: ${OCS_GID}
    pull_policy: never
    restart: unless-stopped
    depends_on: [gateway]
    environment:
      - OPENCODE_SERVER_PASSWORD
    volumes:
      - ${OCS_DIR}:${OCS_DIR}
      - ${OCS_SEED_DIR}:/run/opencode-sandbox:ro
      - state:/home/dev/.local/share/opencode
      - cache:/home/dev/.cache
    working_dir: ${OCS_DIR}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal, egress]

networks:
  internal:
    internal: true
  egress: {}

volumes:
  state: {}
  cache:
    name: opencode-sandbox-cache
    external: true
